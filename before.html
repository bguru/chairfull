<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChairFull</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:#0f172a;background:#fff;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid #e2e8f0}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px}.logo span{color:#0d9488}
.links{display:flex;gap:28px;font-size:16px;color:#475569}
.btn{background:#0d9488;color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;font-size:16px;text-decoration:none;display:inline-block}
.btn.ghost{background:#f1f5f9;color:#0f172a}
.hero{padding:96px 0 80px;display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0d9488;margin-bottom:18px}
h1{font-size:54px;line-height:1.08;letter-spacing:-1.5px;font-weight:800;margin-bottom:22px}
.sub{font-size:21px;color:#475569;margin-bottom:34px;max-width:580px}
.ctas{display:flex;gap:14px}
.card{background:#f0fdfa;border:1px solid #ccfbf1;border-radius:20px;padding:28px}
.msg{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,23,42,.06);font-size:16px}
.msg b{display:block;font-size:13px;color:#0d9488;margin-bottom:4px}
.stat{font-size:15px;color:#475569;margin-top:6px}.stat strong{font-size:30px;color:#0f172a;display:block}
section.faq{background:#f8fafc;padding:72px 0}
h2{font-size:36px;letter-spacing:-.8px;margin-bottom:28px}
details{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px 24px;margin-bottom:12px;font-size:18px}
summary{font-weight:700;cursor:pointer}details p{margin-top:10px;color:#475569}
footer{padding:28px 0;font-size:14px;color:#94a3b8;text-align:center}
</style>
</head><body>
<div id="root"></div>
<script src="app.bundle.js"></script>
</body></html>
